# The CloudNativePG side of the comparison, as close to config/samples as
# the two APIs allow: three instances of the same pinned PostgreSQL image,
# a synchronous quorum of one standby (ANY 1), the same parameters,
# resources and volume size. Applied by bench/cnpg/install.sh.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bench
  namespace: cnpg-bench
spec:
  instances: 3
  imageName: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
  # The official image's postgres user; CloudNativePG's own images use 26.
  postgresUID: 999
  postgresGID: 999
  # The checker connects as postgres with a password, as it does against
  # pg-operator; CloudNativePG keeps it in bench-superuser.
  enableSuperuserAccess: true
  postgresql:
    parameters:
      shared_buffers: 32MB
      max_connections: "60"
      work_mem: 2MB
      maintenance_work_mem: 16MB
    synchronous:
      method: any
      number: 1
      # Writes block rather than degrade to asynchronous when no standby
      # confirms, which is what pg-operator does too.
      dataDurability: required
  # Fail over as soon as the primary is detected as unhealthy (the
  # default, made explicit because it is what is being measured).
  failoverDelay: 0
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
  # Spread instances over the agents, like pg-operator's anti-affinity.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
