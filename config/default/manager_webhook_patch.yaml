# Serve the admission webhooks with a certificate the operator provisions
# itself (internal/webhookcert): it is kept in a Secret shared by all
# replicas and written to an emptyDir at startup. No cert-manager needed.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --webhook-cert-secret=pg-operator-webhook-cert

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --webhook-port=9443

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/k8s-webhook-server/serving-certs
    name: webhook-certs

- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 9443
    name: webhook-server
    protocol: TCP

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: webhook-certs
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
