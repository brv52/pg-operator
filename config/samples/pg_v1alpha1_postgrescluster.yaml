apiVersion: pg.platform.local/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: pg-operator
    app.kubernetes.io/managed-by: kustomize
  name: demo
spec:
  instances: 3
  synchronous:
    method: any
    number: 1
  storage:
    size: 1Gi
  failover:
    probeInterval: 1s
    probeTimeout: 1s
    failureThresholdK: 3
    leaseDuration: 15s
  # Sized for a laptop: three instances, Chaos Mesh and the checker fit in
  # well under 1 GB together.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  parameters:
    shared_buffers: 32MB
    max_connections: "60"
    work_mem: 2MB
    maintenance_work_mem: 16MB
