apiVersion: pg.platform.local/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: pg-operator
    app.kubernetes.io/managed-by: kustomize
  name: demo
spec:
  instances: 3
  synchronous:
    method: any
    number: 1
  storage:
    size: 1Gi
  failover:
    probeInterval: 1s
    probeTimeout: 1s
    failureThresholdK: 3
    leaseDuration: 15s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
