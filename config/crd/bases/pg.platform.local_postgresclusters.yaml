---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: postgresclusters.pg.platform.local
spec:
  group: pg.platform.local
  names:
    kind: PostgresCluster
    listKind: PostgresClusterList
    plural: postgresclusters
    shortNames:
    - pgc
    singular: postgrescluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instances
      name: Instances
      type: integer
    - jsonPath: .status.readyInstances
      name: Ready
      type: integer
    - jsonPath: .status.currentPrimary
      name: Primary
      type: string
    - jsonPath: .status.failoverPhase
      name: Failover
      type: string
    - jsonPath: .status.epoch
      name: Epoch
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresCluster is a highly available PostgreSQL cluster with one primary
          and quorum-synchronous standbys.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PostgresCluster
            properties:
              failover:
                default: {}
                description: Failover tunables.
                properties:
                  failureThresholdK:
                    default: 3
                    description: |-
                      FailureThresholdK is the number of consecutive failed probe rounds
                      required before the primary is declared failed.
                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                  leaseDuration:
                    default: 15s
                    description: |-
                      LeaseDuration of the coordination Lease that records the primary
                      identity and failover epoch.
                    type: string
                  probeInterval:
                    default: 1s
                    description: |-
                      ProbeInterval is the period of the SQL health probe against the
                      primary and of the WAL receiver probe against each standby.
                    type: string
                  probeTimeout:
                    default: 1s
                    description: ProbeTimeout bounds a single probe round trip.
                    type: string
                type: object
              instances:
                default: 3
                description: |-
                  Instances is the number of PostgreSQL pods: one primary and
                  instances-1 streaming standbys.
                format: int32
                maximum: 9
                minimum: 1
                type: integer
              parameters:
                additionalProperties:
                  type: string
                description: |-
                  Parameters are extra postgresql.conf settings. Settings the operator
                  owns (replication, WAL and listen settings) are rejected.
                type: object
              postgresImage:
                description: |-
                  PostgresImage is the operand image. It must contain pg_ctl,
                  pg_basebackup, pg_rewind and a POSIX shell.
                type: string
              resources:
                description: Resources applied to the postgres container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              storage:
                default: {}
                description: Storage for each instance.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 1Gi
                    description: Size of each instance's data volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName for the data volumes. Empty uses
                      the cluster default.
                    type: string
                type: object
              synchronous:
                description: |-
                  Synchronous replication settings. When omitted, commits are
                  acknowledged without waiting for a standby (RPO > 0).
                properties:
                  method:
                    default: any
                    description: |-
                      Method is the quorum method: "any" renders ANY n (...), "first"
                      renders FIRST n (...). "any" is required for the failover safety
                      argument in docs/design.md and is the default.
                    enum:
                    - any
                    - first
                    type: string
                  number:
                    default: 1
                    description: |-
                      Number of standbys that must confirm a commit before it is
                      acknowledged to the client.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
            type: object
            x-kubernetes-validations:
            - message: synchronous.number must be lower than instances
              rule: '!has(self.synchronous) || self.synchronous.number < self.instances'
          status:
            description: status defines the observed state of PostgresCluster
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentPrimary:
                description: CurrentPrimary is the instance that holds the primary
                  role.
                type: string
              epoch:
                description: |-
                  Epoch increases by one on every failover and is mirrored into the
                  coordination Lease and the primary pod annotation.
                format: int64
                type: integer
              failoverPhase:
                description: FailoverPhase is the current step of the failover state
                  machine.
                enum:
                - Healthy
                - Detecting
                - Fencing
                - Promoting
                - Reconfiguring
                type: string
              failoverStartTime:
                description: FailoverStartTime is when the current failover left Healthy.
                format: date-time
                type: string
              instances:
                description: Instances lists per-instance replication state.
                items:
                  description: InstanceStatus is the last observed replication state
                    of one instance.
                  properties:
                    name:
                      type: string
                    ready:
                      description: Ready is true when the pod is Ready and answered
                        the last probe.
                      type: boolean
                    receiveLSN:
                      description: |-
                        ReceiveLSN is pg_last_wal_receive_lsn() on a standby or
                        pg_current_wal_lsn() on the primary.
                      type: string
                    replayLSN:
                      description: ReplayLSN is pg_last_wal_replay_lsn() on a standby.
                      type: string
                    role:
                      description: Role mirrors the pod's role label.
                      type: string
                    streaming:
                      description: Streaming is true when a standby's WAL receiver
                        is connected.
                      type: boolean
                    timeline:
                      format: int64
                      type: integer
                  required:
                  - name
                  - ready
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lastFailoverDuration:
                description: |-
                  LastFailoverDuration is the operator-side duration of the last
                  completed failover (detection excluded).
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is a short human-readable summary.
                type: string
              probeFailures:
                description: ProbeFailures counts consecutive failed primary probe
                  rounds.
                format: int32
                type: integer
              readyInstances:
                description: ReadyInstances is the number of instances that are Ready.
                format: int32
                type: integer
              targetPrimary:
                description: |-
                  TargetPrimary is the instance chosen for promotion during a
                  failover. It equals CurrentPrimary outside a failover.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.instances
        statusReplicasPath: .status.readyInstances
      status: {}
