# One checker run as a Job in the cluster's namespace. bench/run_scenario.sh
# fills in the placeholders with envsubst:
#   NAMESPACE, SECRET/SECRET_KEY (superuser password), RW_SERVICE, RUN_ID,
#   DURATION, KEY_BASE
# The pod is labelled app.kubernetes.io/name=pg-checker so the partition
# experiment can cut the primary off from the client.
apiVersion: batch/v1
kind: Job
metadata:
  name: checker-${RUN_ID}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: pg-checker
    pg.platform.local/run: "${RUN_ID}"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-checker
        pg.platform.local/run: "${RUN_ID}"
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: checker
          image: pg-checker:dev
          imagePullPolicy: IfNotPresent
          args:
            - -duration=${DURATION}
            - -key-base=${KEY_BASE}
            - -workers=4
            - -keys=4
            - -out=/out
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: "${SECRET}", key: "${SECRET_KEY}"}
            - name: CHECKER_DSN
              value: "host=${RW_SERVICE}.${NAMESPACE}.svc user=postgres dbname=postgres connect_timeout=2 sslmode=disable"
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: out, mountPath: /out}
      volumes:
        - name: out
          emptyDir: {sizeLimit: 256Mi}
