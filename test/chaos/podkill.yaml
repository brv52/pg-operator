# Kill the current primary of one cluster, immediately (no graceful
# shutdown). bench/run_scenario.sh fills in the placeholders with
# envsubst: NAMESPACE, RUN_ID and PRIMARY_LABELS, a flow map of the labels
# the operator under test keeps on its primary pod, for pg-operator
# {"pg.platform.local/cluster": "demo", "pg.platform.local/role": "primary"}.
# The selector follows failovers: each run kills whoever is primary now.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: podkill-${RUN_ID}
  namespace: ${NAMESPACE}
  labels:
    pg.platform.local/run: "${RUN_ID}"
spec:
  action: pod-kill
  mode: one
  gracePeriod: 0
  selector:
    namespaces: ["${NAMESPACE}"]
    labelSelectors: ${PRIMARY_LABELS}
